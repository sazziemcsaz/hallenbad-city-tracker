name: collect-loop

# One long job that samples every 10 minutes while the pool is open (06:00-22:00 Zürich time).
# Each job starts its successor ~20 min before its 5h45m budget ends (workflow_dispatch via its own
# token); `concurrency` queues it until the old job finishes, so the chain runs around the clock.
# The cron is only a safety net in case the chain ever breaks: GitHub drops most cron ticks.
on:
  schedule:
    - cron: "7 * * * *" # off-peak minute: GitHub drops many runs at :00
  workflow_dispatch: # start it by hand from the Actions tab

permissions:
  contents: write # needed so the job can push the new CSV rows
  actions: write # needed so the job can start its successor (gh workflow run)
  issues: write # needed to open (and close) an alert issue when collection keeps failing

concurrency:
  group: collect-loop
  cancel-in-progress: false # let the running job finish; one newer job may wait in the queue

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # stay under GitHub's 6 h limit
    steps:
      - uses: actions/checkout@v5
      - name: Set commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sample every 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u collect_loop.py
