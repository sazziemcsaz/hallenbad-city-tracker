name: collect-loop

# One long job that samples every 10 minutes while the pool is open (06:00-22:00 Zürich time).
# The hourly cron below is only there to keep the chain going: `concurrency` queues the next
# job behind the running one, so even if GitHub drops most cron ticks, a new job takes over
# when the old one hits its ~5h45m budget. See collect_loop.py for the details.
# Cron is UTC and Zürich is UTC+1/+2, so 04-20 UTC covers opening hours in winter and summer.
on:
  schedule:
    - cron: "7 4-20 * * *" # off-peak minute: GitHub drops many runs at :00
  workflow_dispatch: # start it by hand from the Actions tab

permissions:
  contents: write # needed so the job can push the new CSV rows

concurrency:
  group: collect-loop
  cancel-in-progress: false # let the running job finish; one newer job may wait in the queue

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # stay under GitHub's 6 h limit
    steps:
      - uses: actions/checkout@v4
      - name: Set commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sample every 10 minutes
        run: python3 -u collect_loop.py
