name: collect

# Manual one-off sample: run it by hand from the Actions tab to take a single sample right now.
# The regular every-10-minutes collection is done by collect-loop.yml (one long job), which
# replaced this workflow's schedule because GitHub's cron dropped most of its runs.
# Take one sample, rebuild the report, commit both back to the repo.
on:
  workflow_dispatch:

permissions:
  contents: write # needed so the job can push the new CSV row

concurrency:
  group: collect
  cancel-in-progress: false # never run two at once, they'd clash on the push

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take a sample
        run: python3 collect.py --open-hours 6-22
      - name: Rebuild the report
        run: python3 report.py --out index.html
      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add occupancy.csv index.html
          git commit -m "sample $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
